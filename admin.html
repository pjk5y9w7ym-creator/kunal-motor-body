<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunal Motor Body | Secure Admin</title><link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body class="admin-page"><div class="admin-wrap">
<a href="index.html" class="outline-btn">← WEBSITE</a><h1 class="admin-title">🔒 SECURE ADMIN PANEL</h1>
<p class="admin-note">Login के बिना कोई upload, delete या website change नहीं कर सकता।</p>

<section id="loginBox" class="admin-card"><h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
<button class="gold-btn full" onclick="login()">LOGIN</button><p id="loginMsg" class="msg"></p></section>

<section id="panel" hidden>
<div class="admin-head"><h2>Admin Controls</h2><button class="outline-btn" onclick="logout()">LOGOUT</button></div>
<div class="admin-grid">
<section class="admin-card"><h2>📷 Photos + 🎥 Videos</h2><p class="muted">एक साथ बहुत सारी files select करें।</p>
<input id="files" type="file" accept="image/*,video/*" multiple><input id="title" placeholder="Title (optional)">
<button class="gold-btn full" onclick="upload()">UPLOAD MEDIA</button><p id="uploadMsg" class="msg"></p></section>
<section class="admin-card"><h2>📝 Website Details</h2>
<input id="tagline" placeholder="Tagline"><input id="address" placeholder="Address"><input id="phone1" placeholder="Phone 1"><input id="phone2" placeholder="Phone 2">
<button class="gold-btn full" onclick="saveSettings()">SAVE CHANGES</button><p id="settingsMsg" class="msg"></p></section>
</div>
<section class="admin-card"><h2>🗂 Uploaded Media</h2><div id="adminMedia" class="media-grid"></div></section>
</section></div>
<script>
const C=window.KMB_CONFIG||{};const db=(C.url&&C.anonKey&&!C.url.includes("YOUR-"))?supabase.createClient(C.url,C.anonKey):null;const bucket='media';
const msg=(id,t,ok=false)=>{const e=document.getElementById(id);e.textContent=t;e.className='msg '+(ok?'ok':'error')};
async function init(){if(!db){msg('loginMsg','config.js में Supabase URL और public anon key डालना बाकी है।');return}const {data:{session}}=await db.auth.getSession();show(session);db.auth.onAuthStateChange((_,s)=>show(s))}
function show(s){loginBox.hidden=!!s;panel.hidden=!s;if(s){loadSettings();async function login(){if(!db)return;const e=email.value.trim(),p=password.value;if(!e||!p)return msg('loginMsg','Email aur password bharo.');const {error}=await db.auth.signInWithPassword({email:e,password:p});if(error)return msg('loginMsg',error.message);show(true);await loadSettings();await loadMedia();}
async function logout(){await db.auth.signOut()}
async function upload(){
  if(!db) return;

  const fs=[...files.files];

  if(!fs.length){
    msg('uploadMsg','Pehle photo ya video select karo.');
    return;
  }

  const {data:{user}}=await db.auth.getUser();

  if(!user){
    msg('uploadMsg','Pehle login karo.');
    return;
  }

  for(const f of fs){

    if(f.size>100*1024*1024){
      msg('uploadMsg',f.name+' 100 MB se badi hai.');
      continue;
    }

    const path=user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');

    const {error:u}=await db.storage
      .from('media')
      .upload(path,f,{upsert:false});

    if(u){
      msg('uploadMsg','Upload failed: '+u.message);
      return;
    }

    const {data:urlData}=db.storage
      .from('media')
      .getPublicUrl(path);

    const {error:d}=await db.from('media').insert({
      user_id:user.id,
      path:path,
      title:title?.value || f.name,
      url:urlData.publicUrl
    });

    if(d){
      await db.storage.from('media').remove([path]);
      msg('uploadMsg','Database error: '+d.message);
      return;
    }
  }

  msg('uploadMsg',fs.length+' file(s) uploaded.',true);
  files.value='';
  if(typeof loadMedia==='function') await loadMedia();
}
}
async function loadSettings(){const {data}=await db.from('site_settings').select('*').eq('id',1).maybeSingle();if(data){tagline.value=data.tagline||'';address.value=data.address||'';phone1.value=data.phone1||'';phone2.value=data.phone2||''}}
async function saveSettings(){const {data:{user}}=await db.auth.getUser();const {error}=await db.from('site_settings').upsert({id:1,tagline:tagline.value,address:address.value,phone1:phone1.value,phone2:phone2.value,updated_by:user.id});msg('settingsMsg',error?error.message:'Changes saved.',!error)}
async function loadMedia(){const box=document.getElementById('adminMedia');const {data}=await db.from('media').select('*').order('created_at',{ascending:false});box.innerHTML=(data||[]).map(x=>`<figure class="media-card">${x.media_type==='photo'?`<img src="${x.public_url}">`:`<video controls src="${x.public_url}"></video>`}<figcaption>${esc(x.title)}</figcaption><button class="danger-btn" onclick="del('${x.id}','${encodeURIComponent(x.storage_path)}')">DELETE</button></figure>`).join('')||'<div class="empty">No media yet.</div>'}
async function del(id,path){if(!confirm('Delete this media?'))return;path=decodeURIComponent(path);await db.storage.from(bucket).remove([path]);await db.from('media').delete().eq('id',id);loadMedia()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
