<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunal Motor Body Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><small>ADMIN PANEL</small><h1>Photos, Videos & Rates</h1><p style="color:#aab8c5">यह panel आपके लिए है। PIN: <b>1234</b> (अपलोड करने से पहले इसे बदलें)।</p><input id="pin" type="password" placeholder="Admin PIN" style="padding:14px;width:100%;max-width:420px"><button class="btn" onclick="login()">Login</button><div id="panel" hidden><h2>Rate</h2><input id="rate" placeholder="उदाहरण: ₹25,000" style="padding:14px;width:100%;max-width:420px"><button class="btn" onclick="saveRate()">Save Rate</button><h2>Photos / Videos</h2><input type="file" accept="image/*,video/*" multiple><p>ध्यान दें: GitHub Pages अकेले public file-upload server नहीं है। असली public photo/video upload के लिए storage/backend जोड़ना होगा।</p></div></main><script>function login(){if(document.getElementById('pin').value==='1234'){document.getElementById('panel').hidden=false}else alert('गलत PIN')}function saveRate(){localStorage.setItem('kunal_rate',document.getElementById('rate').value);alert('Rate इस browser में save हो गया।')}</script></body></html>
