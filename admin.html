<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunal Motor Body Admin</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Admin Panel</h1><p>केवल admin के लिए</p><input id="pin" type="password" placeholder="Admin PIN"><button onclick="login()">Login</button><div id="panel" hidden><h2>Rate</h2><input id="rate" placeholder="Rate"><button onclick="save()">Save Rate</button><h2>Photos / Videos</h2><input type="file" accept="image/*,video/*" multiple><p>Demo admin panel. Public permanent uploads के लिए backend/storage जोड़ना होगा.</p></div></main><script>function login(){if(document.getElementById('pin').value==='1234'){document.getElementById('panel').hidden=false}else alert('गलत PIN')}function save(){localStorage.setItem('kunal_rate',document.getElementById('rate').value);alert('Rate saved')}</script></body></html>
